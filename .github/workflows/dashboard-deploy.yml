name: Deploy Dashboard

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'dashboard/**'
      - '.github/workflows/dashboard-deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: fraudguard-dashboard
  STACK_NAME: fraudguard-ai

jobs:
  build-and-deploy:
    name: Build and Deploy Dashboard
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}
    
    steps:
      - name: Set environment variables
        id: env
        run: |
          # Determine environment: use input if manual dispatch, otherwise default to 'dev'
          if [ -n "${{ github.event.inputs.environment }}" ]; then
            ENV="${{ github.event.inputs.environment }}"
          else
            ENV="dev"
          fi
          
          echo "Setting environment to: ${ENV}"
          
          case $ENV in
            dev)
              echo "table_name=fraudguard-events-dev" >> $GITHUB_OUTPUT
              ;;
            staging)
              echo "table_name=fraudguard-events-staging" >> $GITHUB_OUTPUT
              ;;
            prod)
              echo "table_name=fraudguard-events-prod" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "table_name=fraudguard-events-dev" >> $GITHUB_OUTPUT
              ENV="dev"
              ;;
          esac
          echo "environment=${ENV}" >> $GITHUB_OUTPUT
          echo "✅ Environment set to: ${ENV}"
      
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Build Docker image
        id: build-image
        working-directory: ./dashboard
        run: |
          IMAGE_TAG="${{ github.sha }}"
          ENV="${{ steps.env.outputs.environment }}"
          # Ensure ENV has a default value if empty
          if [ -z "${ENV}" ]; then
            ENV="dev"
          fi
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${ENV}-${IMAGE_TAG}"
          
          echo "Building Docker image for ${ENV} environment..."
          echo "IMAGE_TAG=${IMAGE_TAG}"
          echo "ENV=${ENV}"
          echo "IMAGE_URI=${IMAGE_URI}"
          
          docker build -f dashboard/Dockerfile -t "${IMAGE_URI}" .
          docker tag "${IMAGE_URI}" "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${ENV}-latest"
          
          echo "image_uri=${IMAGE_URI}" >> $GITHUB_OUTPUT
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
      
      - name: Push Docker image to ECR
        run: |
          IMAGE_URI="${{ steps.build-image.outputs.image_uri }}"
          ENV="${{ steps.env.outputs.environment }}"
          # Ensure ENV has a default value if empty
          if [ -z "${ENV}" ]; then
            ENV="dev"
          fi
          echo "Pushing image to ECR..."
          echo "IMAGE_URI=${IMAGE_URI}"
          docker push "${IMAGE_URI}"
          docker push "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${ENV}-latest"
          # Also push as 'latest' for ECS task definition compatibility
          docker tag "${IMAGE_URI}" "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest"
          docker push "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest"
          echo "✅ Image pushed successfully"
      
      - name: Get ECS cluster and service info
        id: get-ecs-info
        run: |
          ENV="${{ steps.env.outputs.environment }}"
          # Try stack name with environment suffix first, fallback to base name for dev
          STACK_NAME_WITH_ENV="${{ env.STACK_NAME }}-${ENV}"
          STACK_NAME_BASE="${{ env.STACK_NAME }}"
          
          # Check which stack exists
          if aws cloudformation describe-stacks --stack-name "${STACK_NAME_WITH_ENV}" --region "${{ env.AWS_REGION }}" >/dev/null 2>&1; then
            STACK_NAME="${STACK_NAME_WITH_ENV}"
          elif aws cloudformation describe-stacks --stack-name "${STACK_NAME_BASE}" --region "${{ env.AWS_REGION }}" >/dev/null 2>&1; then
            STACK_NAME="${STACK_NAME_BASE}"
          else
            echo "⚠️  Neither stack ${STACK_NAME_WITH_ENV} nor ${STACK_NAME_BASE} exists"
            STACK_NAME="${STACK_NAME_WITH_ENV}"
          fi
          
          echo "Using stack name: ${STACK_NAME}"
          echo "stack_name=${STACK_NAME}" >> $GITHUB_OUTPUT
          
          # Get cluster name from stack
          CLUSTER_NAME=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --region "${{ env.AWS_REGION }}" \
            --query "Stacks[0].Outputs[?OutputKey=='DashboardClusterName'].OutputValue" \
            --output text 2>/dev/null || echo "")
          
          if [ -z "${CLUSTER_NAME}" ]; then
            # Try to get from resources
            CLUSTER_NAME=$(aws cloudformation describe-stack-resources \
              --stack-name "${STACK_NAME}" \
              --region "${{ env.AWS_REGION }}" \
              --query "StackResources[?ResourceType=='AWS::ECS::Cluster'].PhysicalResourceId" \
              --output text 2>/dev/null || echo "${STACK_NAME}-dashboard-cluster")
          fi
          
          # Get service name
          SERVICE_NAME=$(aws cloudformation describe-stack-resources \
            --stack-name "${STACK_NAME}" \
            --region "${{ env.AWS_REGION }}" \
            --query "StackResources[?ResourceType=='AWS::ECS::Service'].PhysicalResourceId" \
            --output text 2>/dev/null || echo "${STACK_NAME}-dashboard-service")
          
          # Get task definition family
          TASK_FAMILY=$(aws cloudformation describe-stack-resources \
            --stack-name "${STACK_NAME}" \
            --region "${{ env.AWS_REGION }}" \
            --query "StackResources[?ResourceType=='AWS::ECS::TaskDefinition'].PhysicalResourceId" \
            --output text 2>/dev/null || echo "${STACK_NAME}-dashboard-task")
          
          echo "cluster_name=${CLUSTER_NAME}" >> $GITHUB_OUTPUT
          echo "service_name=${SERVICE_NAME}" >> $GITHUB_OUTPUT
          echo "task_family=${TASK_FAMILY}" >> $GITHUB_OUTPUT
          
          echo "✅ Cluster: ${CLUSTER_NAME}"
          echo "✅ Service: ${SERVICE_NAME}"
          echo "✅ Task Family: ${TASK_FAMILY}"
        continue-on-error: true
      
      - name: Register new ECS task definition
        id: register-task
        run: |
          ENV="${{ steps.env.outputs.environment }}"
          IMAGE_URI="${{ steps.build-image.outputs.image_uri }}"
          TABLE_NAME="${{ steps.env.outputs.table_name }}"
          TASK_FAMILY="${{ steps.get-ecs-info.outputs.task_family }}"
          STACK_NAME="${{ env.STACK_NAME }}-${ENV}"
          
          # Get current task definition
          CURRENT_TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition "${TASK_FAMILY}" \
            --region "${{ env.AWS_REGION }}" \
            --query 'taskDefinition' \
            --output json 2>/dev/null || echo "{}")
          
          if [ "$CURRENT_TASK_DEF" == "{}" ]; then
            echo "⚠️  Task definition not found. Please deploy the CloudFormation stack first."
            exit 1
          fi
          
          # Get S3 bucket name
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --region "${{ env.AWS_REGION }}" \
            --query "Stacks[0].Outputs[?OutputKey=='DataBucketName'].OutputValue" \
            --output text 2>/dev/null || echo '')
          
          # Create new task definition with updated image
          NEW_TASK_DEF=$(echo "$CURRENT_TASK_DEF" | jq \
            --arg IMAGE_URI "${IMAGE_URI}" \
            --arg TABLE_NAME "${TABLE_NAME}" \
            --arg REGION "${{ env.AWS_REGION }}" \
            --arg BUCKET "${BUCKET}" \
            'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy) |
            .containerDefinitions[0].image = $IMAGE_URI |
            .containerDefinitions[0].environment = [
              {"name": "DYNAMODB_TABLE_NAME", "value": $TABLE_NAME},
              {"name": "AWS_REGION", "value": $REGION},
              {"name": "S3_BUCKET_NAME", "value": $BUCKET}
            ]')
          
          # Register new task definition
          TASK_DEF_ARN=$(echo "$NEW_TASK_DEF" | aws ecs register-task-definition \
            --region "${{ env.AWS_REGION }}" \
            --cli-input-json file:///dev/stdin \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          
          echo "task_def_arn=${TASK_DEF_ARN}" >> $GITHUB_OUTPUT
          echo "✅ Registered new task definition: ${TASK_DEF_ARN}"
        continue-on-error: true
      
      - name: Update ECS service
        run: |
          CLUSTER_NAME="${{ steps.get-ecs-info.outputs.cluster_name }}"
          SERVICE_NAME="${{ steps.get-ecs-info.outputs.service_name }}"
          TASK_DEF_ARN="${{ steps.register-task.outputs.task_def_arn }}"
          
          echo "Updating ECS service: ${SERVICE_NAME}"
          echo "Cluster: ${CLUSTER_NAME}"
          echo "New Task Definition: ${TASK_DEF_ARN}"
          
          aws ecs update-service \
            --cluster "${CLUSTER_NAME}" \
            --service "${SERVICE_NAME}" \
            --task-definition "${TASK_DEF_ARN}" \
            --region "${{ env.AWS_REGION }}" \
            --force-new-deployment \
            --output json
          
          echo "✅ Service update initiated"
        continue-on-error: true
      
      - name: Wait for service to stabilize
        run: |
          CLUSTER_NAME="${{ steps.get-ecs-info.outputs.cluster_name }}"
          SERVICE_NAME="${{ steps.get-ecs-info.outputs.service_name }}"
          
          echo "Waiting for service to stabilize..."
          aws ecs wait services-stable \
            --cluster "${CLUSTER_NAME}" \
            --services "${SERVICE_NAME}" \
            --region "${{ env.AWS_REGION }}" \
            || echo "⚠️  Service may still be stabilizing (this is normal)"
        continue-on-error: true
      
      - name: Get ALB URL
        id: get-url
        run: |
          ENV="${{ steps.env.outputs.environment }}"
          STACK_NAME="${{ steps.get-ecs-info.outputs.stack_name }}"
          
          ALB_DNS=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --region "${{ env.AWS_REGION }}" \
            --query "Stacks[0].Outputs[?OutputKey=='DashboardALBDNS'].OutputValue" \
            --output text 2>/dev/null || echo "")
          
          if [ -n "${ALB_DNS}" ]; then
            SERVICE_URL="http://${ALB_DNS}"
            echo "service_url=${SERVICE_URL}" >> $GITHUB_OUTPUT
            echo "✅ Dashboard deployed to: ${SERVICE_URL}"
          else
            echo "⚠️  Could not retrieve ALB DNS name from stack outputs"
            echo "service_url=" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true
      
      - name: Deployment summary
        run: |
          echo "## 🛡️ Dashboard Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ steps.env.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ${{ steps.build-image.outputs.image_uri }}" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ steps.get-url.outputs.service_url }}" ]; then
            echo "**Service URL:** ${{ steps.get-url.outputs.service_url }}" >> $GITHUB_STEP_SUMMARY
          fi
          echo "**Status:** ✅ Deployment completed" >> $GITHUB_STEP_SUMMARY

