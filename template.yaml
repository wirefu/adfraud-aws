AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: FraudGuard AI - Ad Fraud Detection System

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: python3.11
    Environment:
      Variables:
        DYNAMODB_TABLE_NAME: !Ref DynamoDBTableName
        S3_BUCKET_NAME: !Ref DataBucket

Resources:
  # DynamoDB Table
  EventsTable:
    Type: AWS::DynamoDB::Table
    Condition: CreateTable
    Properties:
      TableName: !Sub 'fraudguard-events-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: event_id
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: N
        - AttributeName: campaign_id
          AttributeType: S
        - AttributeName: device_id
          AttributeType: S
        - AttributeName: gclid
          AttributeType: S
        - AttributeName: keyword
          AttributeType: S
        - AttributeName: target_id
          AttributeType: S
      KeySchema:
        - AttributeName: event_id
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: campaign-timestamp-index
          KeySchema:
            - AttributeName: campaign_id
              KeyType: HASH
            - AttributeName: timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: device-timestamp-index
          KeySchema:
            - AttributeName: device_id
              KeyType: HASH
            - AttributeName: timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: gclid-timestamp-index
          KeySchema:
            - AttributeName: gclid
              KeyType: HASH
            - AttributeName: timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: keyword-timestamp-index
          KeySchema:
            - AttributeName: keyword
              KeyType: HASH
            - AttributeName: timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: target-timestamp-index
          KeySchema:
            - AttributeName: target_id
              KeyType: HASH
            - AttributeName: timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        Enabled: true
        AttributeName: ttl
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: FraudGuardAI

  # S3 Bucket
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-data-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ArchiveOldData
            Status: Enabled
            Transitions:
              - TransitionInDays: 90
                StorageClass: GLACIER
          - Id: DeleteOldVersions
            Status: Enabled
            NoncurrentVersionTransitions:
              - TransitionInDays: 30
                StorageClass: GLACIER_IR
            NoncurrentVersionExpirationInDays: 90
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: FraudGuardAI

  # S3 Bucket Policy
  DataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Statement:
          - Sid: DenyInsecureConnections
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !Sub '${DataBucket.Arn}/*'
              - !GetAtt DataBucket.Arn
            Condition:
              Bool:
                'aws:SecureTransport': 'false'

  # Lambda: Ingestion Handler
  IngestionHandler:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-ingestion-handler'
      CodeUri: src/ingestion/
      Handler: app.lambda_handler
      Description: Parse and enrich ad events, store in DynamoDB and S3
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DynamoDBTableName
        - S3WritePolicy:
            BucketName: !Ref DataBucket
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:GetItem
              Resource:
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DynamoDBTableName}'
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DynamoDBTableName}/index/*'

  # Lambda: Fraud Orchestrator
  FraudOrchestrator:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-orchestrator'
      CodeUri: src/orchestrator/
      Handler: app.lambda_handler
      Description: Route events to ML or ML+AI analysis path
      Timeout: 300
      MemorySize: 1024
      Environment:
        Variables:
          SAGEMAKER_ENDPOINT: 'fraudguard-xgboost-endpoint'  # Placeholder until model is deployed
          AI_ANALYZER_FUNCTION: !GetAtt AIAnalyzer.Arn
          DECISION_COMBINER_FUNCTION: !GetAtt DecisionCombiner.Arn
          DYNAMODB_TABLE_NAME: !Ref DynamoDBTableName
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DynamoDBTableName
        - S3WritePolicy:
            BucketName: !Ref DataBucket
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - sagemaker:InvokeEndpoint
                - lambda:InvokeFunction
              Resource: '*'

  # Lambda: AI Analyzer
  AIAnalyzer:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-ai-analyzer'
      CodeUri: src/ai_analyzer/
      Handler: app.lambda_handler
      Description: Deep fraud analysis using Amazon Bedrock Claude
      Timeout: 30
      MemorySize: 1024
      Environment:
        Variables:
          BEDROCK_MODEL_ID: anthropic.claude-3-5-sonnet-20240620-v1:0
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource: '*'

  # Lambda: Decision Combiner
  DecisionCombiner:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-decision-combiner'
      CodeUri: src/decision_combiner/
      Handler: app.lambda_handler
      Description: Combine ML and AI scores for final fraud decisions
      Timeout: 10
      MemorySize: 512
      Environment:
        Variables:
          FRAUD_THRESHOLD: '0.65'
          REVIEW_THRESHOLD: '0.5'
          ML_WEIGHT: '0.4'
          AI_WEIGHT: '0.6'
          ENSEMBLE_METHOD: 'confidence_weighted'

