  # ECS Dashboard Resources
  # Using existing default VPC to avoid VPC limit issues
  # Parameters for VPC and subnets (will use default VPC if not provided)
  DashboardVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-dashboard-vpc'
    Condition: CreateNewVPC

  DashboardPublicSubnet1:
    Type: AWS::EC2::Subnet
    Condition: CreateNewVPC
    Properties:
      VpcId: !Ref DashboardVPC
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-dashboard-subnet-1'

  DashboardPublicSubnet2:
    Type: AWS::EC2::Subnet
    Condition: CreateNewVPC
    Properties:
      VpcId: !Ref DashboardVPC
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.0.2.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-dashboard-subnet-2'

  DashboardInternetGateway:
    Type: AWS::EC2::InternetGateway
    Condition: CreateNewVPC
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-dashboard-igw'

  DashboardInternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Condition: CreateNewVPC
    Properties:
      InternetGatewayId: !Ref DashboardInternetGateway
      VpcId: !Ref DashboardVPC

  DashboardPublicRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: CreateNewVPC
    Properties:
      VpcId: !Ref DashboardVPC
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-dashboard-public-rt'

  DashboardDefaultPublicRoute:
    Type: AWS::EC2::Route
    Condition: CreateNewVPC
    DependsOn: DashboardInternetGatewayAttachment
    Properties:
      RouteTableId: !Ref DashboardPublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref DashboardInternetGateway

  DashboardPublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateNewVPC
    Properties:
      RouteTableId: !Ref DashboardPublicRouteTable
      SubnetId: !Ref DashboardPublicSubnet1

  DashboardPublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateNewVPC
    Properties:
      RouteTableId: !Ref DashboardPublicRouteTable
      SubnetId: !Ref DashboardPublicSubnet2

  # Security Group for ALB
  DashboardALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${AWS::StackName}-dashboard-alb-sg'
      GroupDescription: Security group for Dashboard Application Load Balancer
      VpcId: !If [CreateNewVPC, !Ref DashboardVPC, !Ref VpcId]
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP access
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS access
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-dashboard-alb-sg'

  # Security Group for ECS Tasks
  DashboardECSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${AWS::StackName}-dashboard-ecs-sg'
      GroupDescription: Security group for Dashboard ECS tasks
      VpcId: !If [CreateNewVPC, !Ref DashboardVPC, !Ref VpcId]
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8501
          ToPort: 8501
          SourceSecurityGroupId: !Ref DashboardALBSecurityGroup
          Description: Allow traffic from ALB
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-dashboard-ecs-sg'

  # Application Load Balancer
  DashboardALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${AWS::StackName}-dashboard-alb'
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      Subnets: !If
        - CreateNewVPC
        - - !Ref DashboardPublicSubnet1
          - !Ref DashboardPublicSubnet2
        - !Ref SubnetIds
      SecurityGroups:
        - !Ref DashboardALBSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-dashboard-alb'

  # Target Group for ECS Service
  DashboardTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${AWS::StackName}-dashboard-tg'
      Port: 8501
      Protocol: HTTP
      VpcId: !If [CreateNewVPC, !Ref DashboardVPC, !Ref VpcId]
      TargetType: ip
      HealthCheckProtocol: HTTP
      HealthCheckPath: /_stcore/health
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: 200
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-dashboard-tg'

  # ALB Listener
  DashboardALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref DashboardTargetGroup
      LoadBalancerArn: !Ref DashboardALB
      Port: 80
      Protocol: HTTP

  # ECS Cluster
  DashboardCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${AWS::StackName}-dashboard-cluster'
      CapacityProviders:
        - FARGATE
        - FARGATE_SPOT
      DefaultCapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Weight: 1
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-dashboard-cluster'

  # ECS Task Execution Role
  DashboardTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ECRAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource: '*'
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-dashboard-task-execution-role'

  # ECS Task Role
  DashboardTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Scan
                  - dynamodb:Query
                  - dynamodb:GetItem
                Resource:
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DynamoDBTableName}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DynamoDBTableName}/index/*'
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub '${DataBucket.Arn}/*'
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-dashboard-task-role'

  # ECS Task Definition
  DashboardTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${AWS::StackName}-dashboard-task'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: '1024'
      Memory: '2048'
      ExecutionRoleArn: !GetAtt DashboardTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt DashboardTaskRole.Arn
      ContainerDefinitions:
        - Name: dashboard
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/fraudguard-dashboard:latest'
          Essential: true
          PortMappings:
            - ContainerPort: 8501
              Protocol: tcp
          Environment:
            - Name: DYNAMODB_TABLE_NAME
              Value: !Ref DynamoDBTableName
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: S3_BUCKET_NAME
              Value: !Ref DataBucket
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref DashboardLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: dashboard
          HealthCheck:
            Command:
              - CMD-SHELL
              - 'curl -f http://localhost:8501/_stcore/health || exit 1'
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60

  # CloudWatch Log Group
  DashboardLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${AWS::StackName}-dashboard'
      RetentionInDays: 7

  # CloudWatch Log Group for Google Ads Tracking Handler
  GoogleAdsTrackingLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-google-ads-tracking'
      RetentionInDays: 7

  # CloudWatch Log Group for Ingestion Handler
  IngestionHandlerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-ingestion-handler'
      RetentionInDays: 7

  # CloudWatch Log Group for Orchestrator
  OrchestratorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-orchestrator'
      RetentionInDays: 7

  # CloudWatch Log Group for AI Analyzer
  AIAnalyzerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-ai-analyzer'
      RetentionInDays: 7

  # CloudWatch Log Group for Decision Combiner
  DecisionCombinerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-decision-combiner'
      RetentionInDays: 7

  # ECS Service
  DashboardService:
    Type: AWS::ECS::Service
    DependsOn: DashboardALBListener
    Properties:
      ServiceName: !Sub '${AWS::StackName}-dashboard-service'
      Cluster: !Ref DashboardCluster
      TaskDefinition: !Ref DashboardTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !If
            - CreateNewVPC
            - - !Ref DashboardPublicSubnet1
              - !Ref DashboardPublicSubnet2
            - !Ref SubnetIds
          SecurityGroups:
            - !Ref DashboardECSSecurityGroup
      LoadBalancers:
        - ContainerName: dashboard
          ContainerPort: 8501
          TargetGroupArn: !Ref DashboardTargetGroup
      HealthCheckGracePeriodSeconds: 60
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-dashboard-service'

  # SNS Topic for Alarms
  PlatformOpsAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${AWS::StackName}-ops-alerts'
      DisplayName: Platform Operations Alerts
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: FraudGuardAI

  # SNS Email Subscription (conditional)
  OpsAlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasOpsAlertEmail
    Properties:
      TopicArn: !Ref PlatformOpsAlertsTopic
      Protocol: email
      Endpoint: !Ref OpsAlertEmail

  # API Gateway: REST API
  PlatformAPI:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub '${AWS::StackName}-api'
      Description: Platform API for fraud detection and Google Ads tracking
      EndpointConfiguration:
        Types:
          - REGIONAL

  # API Gateway: Resource for /v1
  APIResourceV1:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref PlatformAPI
      ParentId: !GetAtt PlatformAPI.RootResourceId
      PathPart: v1

  # API Gateway: Resource for /v1/detect-fraud
  APIResourceDetectFraud:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref PlatformAPI
      ParentId: !Ref APIResourceV1
      PathPart: detect-fraud

  # API Gateway: Resource for /pt
  APIResourcePT:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref PlatformAPI
      ParentId: !GetAtt PlatformAPI.RootResourceId
      PathPart: pt

  # API Gateway: Method for POST /v1/detect-fraud
  APIMethodDetectFraud:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref PlatformAPI
      ResourceId: !Ref APIResourceDetectFraud
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${IngestionHandler.Arn}/invocations'
      MethodResponses:
        - StatusCode: 200
        - StatusCode: 400
        - StatusCode: 500

  # API Gateway: Method for GET /pt
  APIMethodPT:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref PlatformAPI
      ResourceId: !Ref APIResourcePT
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GoogleAdsTrackingHandler.Arn}/invocations'
      MethodResponses:
        - StatusCode: 204
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
        - StatusCode: 400
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
        - StatusCode: 500
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true

  # API Gateway: OPTIONS Method for /pt (CORS preflight)
  APIMethodPTOptions:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref PlatformAPI
      ResourceId: !Ref APIResourcePT
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
              method.response.header.Access-Control-Allow-Methods: "'GET,OPTIONS'"
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key'"
        RequestTemplates:
          application/json: '{"statusCode": 200}'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Headers: true

  # API Gateway: OPTIONS Method for /v1/detect-fraud (CORS preflight)
  APIMethodDetectFraudOptions:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref PlatformAPI
      ResourceId: !Ref APIResourceDetectFraud
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key'"
        RequestTemplates:
          application/json: '{"statusCode": 200}'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Headers: true

  # API Gateway: Deployment
  APIDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - APIMethodDetectFraud
      - APIMethodPT
      - APIMethodPTOptions
      - APIMethodDetectFraudOptions
    Properties:
      RestApiId: !Ref PlatformAPI
      StageName: !Ref Environment

  # API Gateway: Stage
  APIStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref PlatformAPI
      DeploymentId: !Ref APIDeployment
      StageName: !Ref Environment
      ThrottleSettings:
        BurstLimit: 10000
        RateLimit: 5000
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          LoggingLevel: INFO
          DataTraceEnabled: true
          MetricsEnabled: true
      AccessLogSetting:
        DestinationArn: !GetAtt APIAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","resourcePath":"$context.resourcePath","status":"$context.status","responseLength":"$context.responseLength"}'

  # CloudWatch Log Group for API Gateway Access Logs
  APIAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/apigateway/${AWS::StackName}-api'
      RetentionInDays: 7

  # Lambda Permission for API Gateway - Ingestion Handler
  IngestionHandlerAPIPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref IngestionHandler
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${PlatformAPI}/*/*'

  # Lambda Permission for API Gateway - Google Ads Tracking Handler
  GoogleAdsTrackingHandlerAPIPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref GoogleAdsTrackingHandler
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${PlatformAPI}/*/*'

  # CloudWatch Alarm: Google Ads Endpoint Response Time
  GoogleAdsResponseTimeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-google-ads-response-time'
      AlarmDescription: Alert when Google Ads endpoint response time exceeds 900ms (approaching 1s timeout)
      MetricName: Duration
      Namespace: AWS/Lambda
      Statistic: p95
      Period: 60
      EvaluationPeriods: 1
      Threshold: 900000
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref GoogleAdsTrackingHandler
      AlarmActions:
        - !Ref PlatformOpsAlertsTopic
      TreatMissingData: notBreaching

  # CloudWatch Alarm: Google Ads Endpoint Timeout
  GoogleAdsTimeoutAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-google-ads-timeout'
      AlarmDescription: Alert when Google Ads endpoint exceeds 1 second (Google will timeout)
      MetricName: Duration
      Namespace: AWS/Lambda
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1000000
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref GoogleAdsTrackingHandler
      AlarmActions:
        - !Ref PlatformOpsAlertsTopic
      TreatMissingData: notBreaching

  # CloudWatch Alarm: Google Ads Endpoint Error Rate
  GoogleAdsErrorRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-google-ads-error-rate'
      AlarmDescription: Alert when Google Ads endpoint error rate exceeds 1%
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref GoogleAdsTrackingHandler
      AlarmActions:
        - !Ref PlatformOpsAlertsTopic
      TreatMissingData: notBreaching

  # CloudWatch Alarm: Lambda Throttling
  LambdaThrottlingAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-lambda-throttling'
      AlarmDescription: Alert when any Lambda function is throttled
      MetricName: Throttles
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref GoogleAdsTrackingHandler
      AlarmActions:
        - !Ref PlatformOpsAlertsTopic
      TreatMissingData: notBreaching

  # CloudWatch Alarm: DynamoDB Throttling
  DynamoDBThrottlingAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-dynamodb-throttling'
      AlarmDescription: Alert when DynamoDB operations are throttled
      MetricName: UserErrors
      Namespace: AWS/DynamoDB
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: TableName
          Value: !Ref EventsTable
      AlarmActions:
        - !Ref PlatformOpsAlertsTopic
      TreatMissingData: notBreaching

  # CloudWatch Alarm: No Traffic to /pt endpoint
  GoogleAdsNoTrafficAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-google-ads-no-traffic'
      AlarmDescription: Alert when no requests to /pt endpoint for 5 minutes (system down or Google stopped sending)
      MetricName: Invocations
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref GoogleAdsTrackingHandler
      AlarmActions:
        - !Ref PlatformOpsAlertsTopic
      TreatMissingData: breaching

  # CloudWatch Alarm: Lambda Cost Spike
  LambdaCostSpikeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-lambda-cost-spike'
      AlarmDescription: Alert when Lambda invocations spike significantly (potential cost issue)
      MetricName: Invocations
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10000
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref GoogleAdsTrackingHandler
      AlarmActions:
        - !Ref PlatformOpsAlertsTopic
      TreatMissingData: notBreaching

  # CloudWatch Dashboard
  GoogleAdsDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub '${AWS::StackName}-google-ads-dashboard'
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "properties": {
                "metrics": [
                  ["AWS/Lambda", "Duration", {"stat": "p50", "label": "p50"}],
                  ["AWS/Lambda", "Duration", {"stat": "p95", "label": "p95"}],
                  ["AWS/Lambda", "Duration", {"stat": "p99", "label": "p99"}]
                ],
                "period": 60,
                "stat": "Average",
                "region": "${AWS::Region}",
                "title": "Google Ads Endpoint Response Time",
                "yAxis": {"left": {"label": "Milliseconds"}}
              }
            },
            {
              "type": "metric",
              "properties": {
                "metrics": [
                  ["AWS/Lambda", "Invocations", {"stat": "Sum"}],
                  ["AWS/Lambda", "Errors", {"stat": "Sum"}],
                  ["AWS/Lambda", "Throttles", {"stat": "Sum"}]
                ],
                "period": 60,
                "stat": "Sum",
                "region": "${AWS::Region}",
                "title": "Google Ads Endpoint Request Volume"
              }
            },
            {
              "type": "metric",
              "properties": {
                "metrics": [
                  ["AWS/DynamoDB", "UserErrors", {"stat": "Sum"}]
                ],
                "period": 300,
                "stat": "Sum",
                "region": "${AWS::Region}",
                "title": "DynamoDB Throttling Events"
              }
            }
          ]
        }

  # Conditions
  HasOpsAlertEmail:
    Fn::Not:
      - Fn::Equals:
          - !Ref OpsAlertEmail
          - ''

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Deployment environment
  
  OpsAlertEmail:
    Type: String
    Default: ''
    Description: Email address for CloudWatch alarm notifications (optional)
  
  VpcId:
    Type: String
    Default: vpc-03cd6462b46350c8e
    Description: VPC ID to use for ECS resources (default VPC)
  
  SubnetIds:
    Type: CommaDelimitedList
    Default: 'subnet-0ec51c4b01051563c,subnet-0dcbb744fa27d655a'
    Description: Subnet IDs to use for ECS resources (default subnets)
  
  CreateDynamoDBTable:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Create DynamoDB table (set to false if table already exists)
  
  DynamoDBTableName:
    Type: String
    Default: fraudguard-events-dev
    Description: DynamoDB table name (use existing table name if CreateDynamoDBTable is false)

Conditions:
  CreateNewVPC: !Equals [!Ref VpcId, '']
  CreateTable: !Equals [!Ref CreateDynamoDBTable, 'true']

Outputs:
  EventsTableName:
    Description: DynamoDB Events Table Name
    Value: !Ref DynamoDBTableName
    Export:
      Name: !Sub '${AWS::StackName}-EventsTable'

  DataBucketName:
    Description: S3 Data Bucket Name
    Value: !Ref DataBucket
    Export:
      Name: !Sub '${AWS::StackName}-DataBucket'

  DataBucketArn:
    Description: S3 Data Bucket ARN
    Value: !GetAtt DataBucket.Arn
    Export:
      Name: !Sub '${AWS::StackName}-DataBucketArn'

  DashboardALBDNS:
    Description: Dashboard Application Load Balancer DNS Name
    Value: !GetAtt DashboardALB.DNSName
    Export:
      Name: !Sub '${AWS::StackName}-DashboardALBDNS'

  DashboardALBURL:
    Description: Dashboard URL
    Value: !Sub 'http://${DashboardALB.DNSName}'
    Export:
      Name: !Sub '${AWS::StackName}-DashboardURL'

  DashboardClusterName:
    Description: ECS Cluster Name
    Value: !Ref DashboardCluster
    Export:
      Name: !Sub '${AWS::StackName}-DashboardClusterName'

  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${PlatformAPI}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
    Export:
      Name: !Sub '${AWS::StackName}-ApiUrl'

  ApiId:
    Description: API Gateway ID
    Value: !Ref PlatformAPI
    Export:
      Name: !Sub '${AWS::StackName}-ApiId'

  PlatformOpsAlertsTopicArn:
    Description: SNS Topic ARN for operations alerts
    Value: !Ref PlatformOpsAlertsTopic
    Export:
      Name: !Sub '${AWS::StackName}-OpsAlertsTopicArn'

  HoneypotApiURL:
    Description: Honeypot API Gateway URL
    Value: !Sub 'https://${HoneypotApi}.execute-api.${AWS::Region}.amazonaws.com/prod/'
    Export:
      Name: !Sub '${AWS::StackName}-HoneypotURL'

